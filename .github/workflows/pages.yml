name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict  # a broken link stops the deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # With "Deploy from a branch", GitHub also runs its own Jekyll build of
      # the repository, which replaces this site with a broken one.
      - name: Confirmar que o GitHub Pages publica a partir desta Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$source" != "workflow" ]; then
            echo "::error title=GitHub Pages mal configurado::Em Settings → Pages → Build and deployment, mude Source para \"GitHub Actions\" e volte a correr esta Action. Com \"Deploy from a branch\" o GitHub publica uma versão Jekyll do repositório por cima deste site."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4

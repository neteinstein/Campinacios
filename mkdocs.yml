site_name: Wikinácios
site_description: Arquivo da Wikinácios, a wiki dos Campinácios.
site_url: https://neteinstein.github.io/Campinacios/
repo_url: https://github.com/neteinstein/Campinacios
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  icon:
    logo: material/tent

plugins:
  - search:
      lang: pt

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/graph.js
  - assets/restrito.js
  - assets/pessoas.js
  - assets/pesquisa-campos.js
  - assets/qrcode.js
  - assets/cantinacio-imprimir.js

validation:
  links:
    anchors: warn

